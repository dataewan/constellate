[package]
name = "constellate"
version = "0.1.0"
edition = "2021"
description = "Terminal-native knowledge management & discovery engine for a Markdown vault"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
pulldown-cmark = "0.13"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
arboard = "3"
# Pure-Rust regex engine (no onig C dependency) for code-block highlighting.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional in-process ONNX embedding backend (no Ollama daemon required).
# Heavy (pulls ONNX Runtime + tokenizers) and downloads the model on first use,
# so it is off by default. Enable with `--features fastembed`.
fastembed = { version = "5", optional = true }

[features]
default = []
fastembed = ["dep:fastembed"]
